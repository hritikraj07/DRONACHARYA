<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="cpp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="cpp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00599C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00599C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#cpp-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#cpp-glow)" />

  <!-- Top Pill: std::vector -->
  <g transform="translate(144, 22)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#0F172A" stroke="#00599C" stroke-width="2" />
    <text x="56" y="17.5" text-anchor="middle" fill="#60A5FA" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="900">
      std::vector
    </text>
  </g>

  <!-- CPU Die Body & Pins -->
  <g transform="translate(200, 115)">
    <!-- Outer Gold/Silver Pin Ring -->
    <rect x="-52" y="-46" width="104" height="92" rx="4" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="7 7" />
    <!-- Chip Die -->
    <rect x="-40" y="-34" width="80" height="68" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="3" />
    <text x="0" y="11" text-anchor="middle" fill="#FFFFFF" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="1">
      C++
    </text>
  </g>

  <!-- Circuit Bus Traces -->
  <path d="M 65,85 L 125,85 L 145,98" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="65" cy="85" r="3.5" fill="#60A5FA" />

  <path d="M 335,145 L 275,145 L 255,132" stroke="#60A5FA" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <circle cx="335" cy="145" r="3.5" fill="#60A5FA" />
</svg>
