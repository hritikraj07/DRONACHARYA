<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="css-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="css-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#css-grid)" />

  <circle cx="200" cy="100" r="90" fill="url(#css-glow)" />

  <!-- Incoming White Light Ray -->
  <line x1="45" y1="112" x2="185" y2="98" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Glass Prism Triangle -->
  <polygon
    points="200,32 152,148 248,148"
    fill="rgba(30, 41, 59, 0.75)"
    stroke="#38BDF8"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Inner Glass Reflection Highlight -->
  <line x1="200" y1="40" x2="162" y2="142" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />

  <!-- Refracted Rainbow Rays (Spectral Dispersion) -->
  <line x1="222" y1="104" x2="355" y2="72" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
  <line x1="223" y1="108" x2="355" y2="86" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" />
  <line x1="224" y1="112" x2="355" y2="100" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round" />
  <line x1="225" y1="116" x2="355" y2="114" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" />
  <line x1="226" y1="120" x2="355" y2="128" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="227" y1="124" x2="355" y2="142" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" />

  <!-- Crosshair Target Pill: display: grid -->
  <g transform="translate(112, 106)">
    <!-- Targeting Crosshair Circles -->
    <circle cx="44" cy="18" r="22" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <circle cx="44" cy="18" r="3" fill="#38BDF8" />
    <rect x="0" y="5" width="94" height="26" rx="8" fill="#0A0E1A" stroke="#38BDF8" stroke-width="1.8" />
    <text x="47" y="22" text-anchor="middle" fill="#38BDF8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="900">
      display: grid
    </text>
  </g>
</svg>
