<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="git-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="git-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F05032" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F05032" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#git-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#git-glow)" />

  <!-- Top Pill: git commit -m -->
  <g transform="translate(136, 22)">
    <rect x="0" y="0" width="128" height="26" rx="13" fill="#0F172A" stroke="#F05032" stroke-width="2" />
    <text x="64" y="17.5" text-anchor="middle" fill="#F87171" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="900">
      git commit -m
    </text>
  </g>

  <!-- Main Branch Line (Blue) -->
  <line x1="60" y1="130" x2="340" y2="130" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Feature Branch Arc (Orange) -->
  <path
    d="M 130,130 C 155,130 155,78 185,78 L 225,78 C 255,78 255,130 280,130"
    fill="none"
    stroke="#F05032"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Main Commits -->
  <circle cx="90" cy="130" r="7.5" fill="#0A0E1A" stroke="#38BDF8" stroke-width="3.5" />
  <circle cx="130" cy="130" r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="205" cy="130" r="7.5" fill="#0A0E1A" stroke="#38BDF8" stroke-width="3.5" />
  <circle cx="280" cy="130" r="8.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="320" cy="130" r="7.5" fill="#0A0E1A" stroke="#38BDF8" stroke-width="3.5" />

  <!-- Feature Branch Commits -->
  <circle cx="185" cy="78" r="7.5" fill="#F05032" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="225" cy="78" r="7.5" fill="#F05032" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
