<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern matching Python & CSS banners -->
    <pattern id="html-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="html-glow-orange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E44D26" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#E44D26" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="html-glow-cyan" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#html-grid)" />

  <!-- Backlight Glows -->
  <circle cx="200" cy="100" r="95" fill="url(#html-glow-orange)" />
  <circle cx="100" cy="95" r="70" fill="url(#html-glow-cyan)" />

  <!-- Left Code Bracket Pill -->
  <g transform="translate(38, 85)">
    <rect x="0" y="0" width="84" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <text x="42" y="20" text-anchor="middle" fill="#38BDF8" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="900">
      &lt;main&gt;
    </text>
  </g>

  <!-- Right Code Bracket Pill -->
  <g transform="translate(278, 85)">
    <rect x="0" y="0" width="84" height="30" rx="15" fill="#0F172A" stroke="#F97316" stroke-width="2" />
    <text x="42" y="20" text-anchor="middle" fill="#F97316" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="900">
      &lt;/main&gt;
    </text>
  </g>

  <!-- Version Badge: v5.3 (Top Right, matching Python banner) -->
  <g transform="translate(294, 24)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.8" />
    <text x="34" y="16" text-anchor="middle" fill="#F97316" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="900" letter-spacing="0.5">
      v5.3
    </text>
  </g>

  <!-- Top Yellow Sparkle Accent -->
  <polygon points="125,35 127,42 134,44 127,46 125,53 123,46 116,44 123,42" fill="#FACC15" />
  <polygon points="275,160 276.5,165 281,166.5 276.5,168 275,173 273.5,168 269,166.5 273.5,165" fill="#38BDF8" />

  <!-- ========================================================
       OFFICIAL W3C HTML5 3D SHIELD LOGO (Crisp, High-Res Vector)
       ======================================================== -->
  <g transform="translate(200, 100) scale(0.28) translate(-256, -306)">
    <!-- Outer Shield (Dark Orange / Left) -->
    <polygon fill="#E44D26" points="107.644,470.877 74.633,100.62 437.367,100.62 404.321,470.819 255.778,512" />

    <!-- Right Facet (Bright Orange) -->
    <polygon fill="#F16529" points="256,480.523 376.03,447.246 404.27,130.894 256,130.894" />

    <!-- Inner '5' Right Facet (Light Silver #EBEBEB) -->
    <polygon fill="#EBEBEB" points="256,130.894 362.868,130.894 356.296,163.79 256,163.79" />
    <polygon fill="#EBEBEB" points="256,235.285 349.88,235.285 343.308,346.398 256,372.449 256,339.516 321.171,321.905 325.974,268.217 256,268.217" />

    <!-- Inner '5' Left Facet (Pure White #FFFFFF) - Continuous Upper Stem + Middle Bar -->
    <polygon fill="#FFFFFF" points="256,130.894 149.132,130.894 162.276,268.217 256,268.217 256,235.285 195.172,235.285 188.6,163.79 256,163.79" />
    <!-- Inner '5' Left Facet - Bottom Hook -->
    <polygon fill="#FFFFFF" points="256,372.449 160.066,346.398 154.736,286.029 187.632,286.029 190.829,321.905 256,339.516" />
  </g>
</svg>
