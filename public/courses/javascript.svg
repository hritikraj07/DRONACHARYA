<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="js-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="js-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#js-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#js-glow)" />

  <!-- Top Pill: async / await -->
  <g transform="translate(142, 22)">
    <rect x="0" y="0" width="116" height="26" rx="13" fill="#0F172A" stroke="#FACC15" stroke-width="2" />
    <text x="58" y="17.5" text-anchor="middle" fill="#FACC15" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="900">
      async / await
    </text>
  </g>

  <!-- Left Lightning Bolt -->
  <path
    d="M 80,68 L 92,94 L 84,97 L 98,132 L 88,104 L 96,101 Z"
    fill="#FACC15"
    stroke="#FEF08A"
    stroke-width="1.2"
  />

  <!-- Right Lightning Bolt -->
  <path
    d="M 320,68 L 308,94 L 316,97 L 302,132 L 312,104 L 304,101 Z"
    fill="#FACC15"
    stroke="#FEF08A"
    stroke-width="1.2"
  />

  <!-- Central JS Hexagon -->
  <g transform="translate(200, 114)">
    <polygon
      points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27"
      fill="#FACC15"
      stroke="#FEF08A"
      stroke-width="3"
    />
    <!-- Bold 'JS' Typography -->
    <text
      x="0"
      y="14"
      text-anchor="middle"
      fill="#0F172A"
      font-size="38"
      font-family="system-ui, -apple-system, sans-serif"
      font-weight="900"
      letter-spacing="-1.5"
    >
      JS
    </text>
  </g>
</svg>
