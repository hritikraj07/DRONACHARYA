<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="node-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#339933" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#339933" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#node-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#node-glow)" />

  <!-- Top Pill: node server.js -->
  <g transform="translate(136, 22)">
    <rect x="0" y="0" width="128" height="26" rx="13" fill="#0F172A" stroke="#339933" stroke-width="2" />
    <text x="64" y="17.5" text-anchor="middle" fill="#34D399" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="900">
      node server.js
    </text>
  </g>

  <!-- Isometric Server Block -->
  <g transform="translate(200, 110)">
    <!-- Top Face -->
    <polygon points="0,-44 46,-22 0,0 -46,-22" fill="#43A047" stroke="#66BB6A" stroke-width="2.5" />
    <!-- Right Face -->
    <polygon points="46,-22 46,28 0,50 0,0" fill="#2E7D32" stroke="#66BB6A" stroke-width="2.5" />
    <!-- Left Face -->
    <polygon points="-46,-22 -46,28 0,50 0,0" fill="#1B5E20" stroke="#66BB6A" stroke-width="2.5" />
    <!-- Server LED status lights -->
    <circle cx="-20" cy="12" r="3" fill="#69F0AE" />
    <circle cx="-8" cy="19" r="3" fill="#69F0AE" />
    <circle cx="20" cy="12" r="3" fill="#69F0AE" />
  </g>

  <!-- Data Bus Lines -->
  <path d="M 60,110 L 130,110" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 5" />
  <path d="M 270,110 L 340,110" stroke="#34D399" stroke-width="2.5" stroke-dasharray="5 5" />
</svg>
