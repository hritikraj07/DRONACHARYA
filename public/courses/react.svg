<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="react-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="react-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#react-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#react-glow)" />

  <!-- Top Pill: useState() -->
  <g transform="translate(144, 22)">
    <rect x="0" y="0" width="112" height="26" rx="13" fill="#0F172A" stroke="#61DAFB" stroke-width="2" />
    <text x="56" y="17.5" text-anchor="middle" fill="#61DAFB" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="900">
      useState()
    </text>
  </g>

  <!-- React Atomic Orbitals -->
  <g transform="translate(200, 114)">
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="12" fill="#61DAFB" />

    <!-- Orbital 1 (Horizontal) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#61DAFB" stroke-width="3" />
    <circle cx="62" cy="-9" r="4.5" fill="#61DAFB" />

    <!-- Orbital 2 (60 deg) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(60)" />
    <circle cx="-32" cy="-56" r="4.5" fill="#61DAFB" />

    <!-- Orbital 3 (120 deg) -->
    <ellipse cx="0" cy="0" rx="68" ry="24" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(120)" />
    <circle cx="-32" cy="56" r="4.5" fill="#61DAFB" />
  </g>
</svg>
