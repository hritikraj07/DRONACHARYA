<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <pattern id="sql-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
    <radialGradient id="sql-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00758F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00758F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0A0E1A" />
  <rect width="100%" height="100%" fill="url(#sql-grid)" />

  <circle cx="200" cy="110" r="90" fill="url(#sql-glow)" />

  <!-- Top Pill: SELECT * FROM db -->
  <g transform="translate(130, 22)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <text x="70" y="17.5" text-anchor="middle" fill="#38BDF8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="900">
      SELECT * FROM db
    </text>
  </g>

  <!-- 3D Database Cylinders Stack -->
  <g transform="translate(200, 75)">
    <!-- Bottom Cylinder -->
    <g transform="translate(0, 56)">
      <ellipse cx="0" cy="22" rx="52" ry="15" fill="#004D5E" stroke="#00758F" stroke-width="2.5" />
      <rect x="-52" y="0" width="104" height="22" fill="#004D5E" />
      <ellipse cx="0" cy="0" rx="52" ry="15" fill="#00657A" stroke="#38BDF8" stroke-width="2.5" />
    </g>

    <!-- Middle Cylinder -->
    <g transform="translate(0, 28)">
      <ellipse cx="0" cy="22" rx="52" ry="15" fill="#00657A" stroke="#38BDF8" stroke-width="2.5" />
      <rect x="-52" y="0" width="104" height="22" fill="#00657A" />
      <ellipse cx="0" cy="0" rx="52" ry="15" fill="#008EA8" stroke="#38BDF8" stroke-width="2.5" />
    </g>

    <!-- Top Cylinder -->
    <g transform="translate(0, 0)">
      <ellipse cx="0" cy="22" rx="52" ry="15" fill="#008EA8" stroke="#38BDF8" stroke-width="2.5" />
      <rect x="-52" y="0" width="104" height="22" fill="#008EA8" />
      <ellipse cx="0" cy="0" rx="52" ry="15" fill="#00B4D8" stroke="#38BDF8" stroke-width="3" />
    </g>
  </g>
</svg>
