<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <clipPath id="tile-clip">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile-clip)">
    <!-- Base background -->
    <rect width="64" height="64" fill="#EA4335" />
    <!-- Grid overlay pattern -->
    <pattern id="grid-dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="3.2" height="3.2" fill="#B3261E" />
    </pattern>
    <rect width="64" height="64" fill="url(#grid-dots)" opacity="0.45" />

    <!-- Pixel Art Gmail Envelope M (4px grid) -->
    <!-- Outer Envelope Body -->
    <!-- Row 4-11: Outer white grid cells -->
    <!-- Top flap and M lines -->
    <!-- Left vertical bar of M -->
    <rect x="12" y="16" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="20" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="36" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="40" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="12" y="44" width="3.2" height="3.2" fill="#FFFFFF" />

    <rect x="16" y="16" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="20" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="36" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="40" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="16" y="44" width="3.2" height="3.2" fill="#FFFFFF" />

    <!-- Right vertical bar of M -->
    <rect x="44" y="16" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="20" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="36" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="40" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="44" y="44" width="3.2" height="3.2" fill="#FFFFFF" />

    <rect x="48" y="16" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="20" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="36" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="40" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="48" y="44" width="3.2" height="3.2" fill="#FFFFFF" />

    <!-- Diagonal folds meeting in center -->
    <rect x="20" y="20" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="24" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="28" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="32" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="36" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="40" y="20" width="3.2" height="3.2" fill="#FFFFFF" />

    <rect x="20" y="24" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="24" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="28" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="32" y="32" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="36" y="28" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="40" y="24" width="3.2" height="3.2" fill="#FFFFFF" />

    <!-- Bottom envelope border -->
    <rect x="20" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="24" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="28" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="32" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="36" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
    <rect x="40" y="44" width="3.2" height="3.2" fill="#FFFFFF" />
  </g>
</svg>